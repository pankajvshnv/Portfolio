services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: always
    ports:
      # Expose only to VPS localhost so Caddy acts as secure reverse proxy
      - "127.0.0.1:8000:8000"
    volumes:
      # Persist SQLite database across rebuilds
      - ./portfolio.db:/app/portfolio.db
      # Persist uploaded resumes and assets
      - ./static/uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
