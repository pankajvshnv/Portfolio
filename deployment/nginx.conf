# Nginx configuration for Pankaj Portfolio
# Replace YOUR_DOMAIN.COM with your actual domain name (e.g. pankajbairagi.com)

server {
    listen 80;
    listen [::]:80;
    server_name pankajbairagi.dev www.pankajbairagi.dev;

    # Maximum file upload size (for resume/asset uploads)
    client_max_body_size 25M;

    # Static assets cache
    location /static/ {
        alias /var/www/portfolio/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Proxy all dynamic requests to FastAPI / Uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
