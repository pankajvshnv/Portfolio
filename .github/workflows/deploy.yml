name: Deploy Portfolio with Docker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated Docker deployment..."
            
            APP_DIR="/var/www/portfolio"

            # 1. Clone or navigate to app directory
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR..."
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
              git clone https://github.com/pankajvshnv/Portfolio.git $APP_DIR
            fi

            cd $APP_DIR

            # 2. Stop old systemd service if running to prevent port 8000 conflict
            echo "🛑 Ensuring standalone service is stopped..."
            sudo systemctl stop portfolio.service 2>/dev/null || true
            sudo systemctl disable portfolio.service 2>/dev/null || true

            # 3. Pull latest changes from GitHub
            echo "📥 Pulling latest main branch from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # 4. Ensure database file, upload directory and safe permissions
            touch portfolio.db
            mkdir -p static/uploads
            sudo chown -R $USER:$USER static/uploads 2>/dev/null || true
            sudo chmod -R 777 static/uploads 2>/dev/null || chmod -R 777 static/uploads 2>/dev/null || true

            # 5. Build and deploy container with Docker Compose
            echo "🐳 Building and starting Docker container..."
            if docker compose version &> /dev/null; then
              docker compose up -d --build
            elif command -v docker-compose &> /dev/null; then
              docker-compose up -d --build
            else
              echo "❌ Docker Compose not found. Please install Docker Compose."
              exit 1
            fi

            # 6. Verify container health
            echo "⏳ Checking container status..."
            healthy=false
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != "true" ]; then
              echo "❌ Container failed health check"
              docker ps -a
              docker logs portfolio_app
              exit 1
            fi

            # 7. Reload Caddy reverse proxy
            sudo systemctl reload caddy 2>/dev/null || true

            echo "✅ Portfolio deployed successfully with Docker and accessible via Caddy!"
