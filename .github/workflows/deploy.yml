name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment on VPS..."
            
            APP_DIR="/var/www/portfolio"
            
            # Ensure app directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR..."
              sudo mkdir -p $APP_DIR
              sudo chown -R $USER:$USER $APP_DIR
              git clone https://github.com/pankajvshnv/Portfolio.git $APP_DIR
            fi

            cd $APP_DIR
            
            # Stash any local changes to prevent merge conflicts
            git stash || true
            
            # Pull latest changes from main branch
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            # Set up or activate Python virtual environment
            if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            echo "📦 Installing/updating dependencies..."
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Ensure upload directory exists and has proper permissions
            mkdir -p static/uploads
            chmod -R 755 static/uploads
            
            # Seed database if not present
            if [ ! -f "portfolio.db" ]; then
              echo "🌱 Initializing database with seed data..."
              python seed_data.py
            fi

            # Restart application service
            echo "🔄 Restarting portfolio service..."
            sudo systemctl restart portfolio.service
            
            # Verify status
            sudo systemctl is-active --quiet portfolio.service && echo "✅ Portfolio deployed and running successfully!" || (echo "❌ Service failed to start" && sudo journalctl -u portfolio.service -n 20 --no-pager && exit 1)
