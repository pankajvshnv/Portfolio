{% extends "base.html" %}

{% block title %}Admin Login — {{ profile.name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<section id="login" class="code-section">
  <div class="code-content full">
    <p class="code-comment"># login.py</p>
    <h2 class="section-title">Admin Login</h2>

    <div style="max-width: 400px; margin: 40px auto; background: var(--bg-card); padding: 30px; border-radius: 8px; border: 1px solid var(--border);">
      {% if error %}
      <p style="color: #ff5555; margin-bottom: 15px;">{{ error }}</p>
      {% endif %}
      <form action="/login" method="POST">
        <div style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: var(--text-muted);">Password</label>
          <input type="password" name="password" style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px;" required>
        </div>
        <button type="submit" style="background: #4ec9b0; color: #1e1e1e; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%;">Login</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
